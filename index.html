<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tủ Phim Của Tôi</title>
    <style>
        :root {
            --bg-color: #0b0f19;       
            --text-color: #ffffff;
            --accent-color: #3b82f6;   
            --accent-hover: #2563eb;   
            --card-bg: #1e293b;        
            --border-color: #334155;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0; line-height: 1.6;
        }

        header {
            background-color: rgba(11, 15, 25, 0.9); padding: 20px 50px;
            text-align: center; border-bottom: 2px solid var(--accent-color);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }

        header h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 1px; }
        header p { margin: 5px 0 0; color: #94a3b8; font-size: 1.1em; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .controls {
            display: flex; flex-direction: column; gap: 15px;
            margin-bottom: 30px; background-color: var(--card-bg);
            padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border-color);
        }
        
        .controls-top {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; width: 100%;
        }

        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn {
            background-color: transparent; border: 1px solid var(--border-color);
            color: #94a3b8; padding: 8px 15px; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .filter-btn:hover { border-color: var(--accent-color); color: white; }
        .filter-btn.active { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }

        .search-bar {
            padding: 10px 15px; border: 1px solid var(--border-color); border-radius: 6px;
            background-color: #0f172a; color: white; width: 250px; font-size: 1em;
        }
        .search-bar:focus { outline: 1px solid var(--accent-color); }
        
        .add-btn {
            background-color: var(--accent-color); color: white; border: none; padding: 10px 20px; 
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .add-btn:hover { background-color: var(--accent-hover); transform: scale(1.05); }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px; }
        .movie-card {
            background-color: var(--card-bg); border-radius: 10px; overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
            position: relative; border: 1px solid var(--border-color);
        }
        .movie-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--accent-color); }

        .status-badge {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 5px 10px; border-radius: 20px;
            font-size: 0.8em; backdrop-filter: blur(5px); border: 1px solid var(--border-color);
        }

        .movie-poster { width: 100%; height: 300px; object-fit: cover; display: block; }
        .movie-info { padding: 15px; }
        .movie-title { margin: 0 0 10px; font-size: 1.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { display: flex; justify-content: space-between; color: #94a3b8; font-size: 0.9em; margin-bottom: 5px; }
        .movie-rating { color: #f5c518; font-weight: bold; }

        .delete-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(15, 23, 42, 0.8);
            color: #ef4444; border: none; border-radius: 50%; width: 30px; height: 30px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s, background 0.3s; z-index: 10;
        }
        .movie-card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #ef4444; color: white; }

        /* Modal chung */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background-color: var(--card-bg); width: 90%; max-width: 1000px;
            border-radius: 12px; display: flex; overflow: hidden; position: relative;
            border: 1px solid var(--border-color); max-height: 90vh; overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        /* Tùy chỉnh riêng cho Modal Chi tiết Phim (Kiểu Điện Ảnh) */
        .detail-content {
            background-color: #0b0f19;
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
        }
        
        .detail-overlay {
            display: flex; width: 100%;
            background: linear-gradient(to right, rgba(11, 15, 25, 1) 25%, rgba(11, 15, 25, 0.85) 50%, rgba(11, 15, 25, 0.3) 100%);
            padding: 40px; box-sizing: border-box;
        }

        .modal-poster { 
            width: 300px; border-radius: 8px; object-fit: cover; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 2; border: 1px solid rgba(255,255,255,0.1);
        }
        
        .modal-details { 
            padding-left: 40px; flex: 1; display: flex; flex-direction: column; z-index: 2; 
        }
        .modal-details h2 { margin-top: 0; color: white; font-size: 2.5em; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); line-height: 1.2; }
        .modal-desc { margin-top: 15px; line-height: 1.8; color: #cbd5e1; font-size: 1.05em; margin-bottom: 20px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 30px; color: white; cursor: pointer; z-index: 10; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .close-btn:hover { color: var(--accent-color); }

        .status-selector { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
        .status-selector select { 
            padding: 8px 15px; background: rgba(15, 23, 42, 0.8); color: white; 
            border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-size: 1em;
            backdrop-filter: blur(5px);
        }
        .status-selector select:focus { outline: none; border-color: var(--accent-color); }

        .trailer-btn {
            background-color: #e50914; color: white; border: none; padding: 10px 20px; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: fit-content; margin-top: 15px;
            box-shadow: 0 4px 10px rgba(229, 9, 20, 0.4);
        }
        .trailer-btn:hover { background-color: #b20710; transform: scale(1.05); }
        .trailer-btn:disabled { background-color: #555; cursor: not-allowed; transform: none; box-shadow: none; }
        .trailer-container { margin-top: 20px; width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* Style cho Modal Tìm Kiếm (Giữ nguyên gọn gàng) */
        .form-content { flex-direction: column; padding: 30px; max-width: 500px; background-color: var(--card-bg); }
        .form-content h2 { margin-top: 0; color: white; text-align: center; }
        .search-tmdb-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-tmdb-box input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 6px; }
        .search-tmdb-box button { padding: 10px 15px; background: var(--accent-color); color: white; border: none; border-radius: 6px; cursor: pointer; }
        .search-tmdb-box button:hover { background: var(--accent-hover); }
        #tmdbResults { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .tmdb-item { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 8px; border-radius: 6px; cursor: pointer; transition: 0.2s; border: 1px solid var(--border-color); }
        .tmdb-item:hover { border-color: var(--accent-color); background: #1e293b; }
        .tmdb-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; }

        @media (max-width: 768px) {
            .detail-overlay { flex-direction: column; padding: 20px; background: rgba(11, 15, 25, 0.9); }
            .modal-poster { width: 100%; height: auto; max-height: 400px; }
            .modal-details { padding-left: 0; padding-top: 20px; width: 100%; box-sizing: border-box; }
            .controls-top { flex-direction: column; align-items: stretch; }
            .search-bar { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Tủ Phim Của Tôi</h1>
        <p>Kho lưu trữ cá nhân phong cách hiện đại</p>
    </header>

    <div class="container">
        <div class="controls">
            <div class="controls-top">
                <input type="text" class="search-bar" placeholder="Tìm kiếm trong tủ...">
                <button id="openFormBtn" class="add-btn">+ Thêm Phim Từ TMDB</button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Tất cả</button>
                <button class="filter-btn" data-filter="favorite">❤️ Yêu thích</button>
                <button class="filter-btn" data-filter="watched">👀 Đã xem</button>
                <button class="filter-btn" data-filter="plan_to_watch">🕒 Muốn xem</button>
            </div>
        </div>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <!-- Cửa sổ xem chi tiết phim (Giao diện điện ảnh) -->
    <div id="movieModal" class="modal">
        <div class="modal-content detail-content" id="detailModalContent">
            <span class="close-btn" id="closeDetailBtn">&times;</span>
            <div class="detail-overlay">
                <img id="modalImg" class="modal-poster" src="" alt="Poster">
                <div class="modal-details">
                    <h2 id="modalTitle">Tên Phim</h2>
                    <div id="modalMeta" class="movie-meta" style="justify-content: flex-start; gap: 20px; margin-bottom: 15px; font-size: 1.1em;"></div>
                    
                    <div class="status-selector">
                        <label style="color: #cbd5e1; text-shadow: 1px 1px 2px black;">Phân loại:</label>
                        <select id="modalStatus">
                            <option value="favorite">❤️ Yêu thích</option>
                            <option value="watched">👀 Đã xem</option>
                            <option value="plan_to_watch">🕒 Muốn xem</option>
                        </select>
                    </div>

                    <p id="modalDesc" class="modal-desc">Nội dung chi tiết...</p>
                    <button id="playTrailerBtn" class="trailer-btn">▶ Xem Trailer</button>
                    <div id="trailerContainer" class="trailer-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cửa sổ tìm kiếm TMDB -->
    <div id="addMovieModal" class="modal">
        <div class="modal-content form-content">
            <span class="close-btn" id="closeFormBtn" style="color: #94a3b8;">&times;</span>
            <h2>Tìm Phim Từ TMDB</h2>
            <div class="search-tmdb-box">
                <input type="text" id="tmdbSearchInput" placeholder="Nhập tên phim (VD: Avengers)...">
                <button id="tmdbSearchBtn">Tìm</button>
            </div>
            <div id="tmdbResults">
                <p style="color: #94a3b8; text-align: center; font-size: 0.9em;">Gõ tên phim và bấm Tìm để chọn phim chính thống.</p>
            </div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = "474d7f0a0f0765ce60c19a33e23e1fe8"; 

        const statusMap = {
            'favorite': '❤️ Yêu thích',
            'watched': '👀 Đã xem',
            'plan_to_watch': '🕒 Muốn xem'
        };

        const defaultMovies = [
            { id: 157335, title: "Interstellar", year: "2014", rating: "8.6", img: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", desc: "Một nhóm nhà thám hiểm vũ trụ đi qua một hố đen nhằm tìm kiếm một hành tinh có thể sinh sống được cho nhân loại.", status: "favorite", backdrop: "https://image.tmdb.org/t/p/w1280/xJHokMbljvjEVAZS3xZZIqSWEgD.jpg" },
            { id: 155, title: "The Dark Knight", year: "2008", rating: "9.0", img: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg", desc: "Batman đối mặt với thử thách lớn nhất về thể chất lẫn tinh thần từ trước đến nay để chống lại kẻ thù điên loạn Joker.", status: "watched", backdrop: "https://image.tmdb.org/t/p/w1280/nMKdUUepR0i5zn0y1T4CsSB5chy.jpg" }
        ];

        let myMovies = JSON.parse(localStorage.getItem('myTmdbLibraryBlue'));
        if (!myMovies) {
            myMovies = defaultMovies;
            localStorage.setItem('myTmdbLibraryBlue', JSON.stringify(myMovies));
        }

        let currentOpenMovieIndex = null;
        const movieGrid = document.getElementById('movieGrid');
        const detailModalContent = document.getElementById('detailModalContent');

        function renderMovies() {
            movieGrid.innerHTML = '';
            myMovies.forEach((movie, index) => {
                if(!movie.status) movie.status = 'plan_to_watch'; 

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.dataset.status = movie.status;
                
                card.innerHTML = `
                    <div class="status-badge">${statusMap[movie.status]}</div>
                    <button class="delete-btn" title="Xóa phim">&times;</button>
                    <img src="${movie.img}" class="movie-poster" style="width: 100%; border-radius: 0; box-shadow: none;" alt="${movie.title}">
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta"><span>${movie.year}</span><span class="movie-rating">★ ${movie.rating}</span></div>
                    </div>
                `;
                
                card.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(confirm(`Bạn có muốn xóa phim "${movie.title}" không?`)) {
                        myMovies.splice(index, 1);
                        localStorage.setItem('myTmdbLibraryBlue', JSON.stringify(myMovies));
                        renderMovies();
                    }
                });

                card.addEventListener('click', async () => {
                    currentOpenMovieIndex = index;
                    
                    document.getElementById('modalTitle').textContent = movie.title;
                    document.getElementById('modalImg').src = movie.img;
                    document.getElementById('modalMeta').innerHTML = `<span>Năm phát hành: <b>${movie.year}</b></span> <span style="color: #f5c518;">Điểm TMDB: <b>★ ${movie.rating}</b></span>`;
                    document.getElementById('modalDesc').textContent = movie.desc;
                    document.getElementById('modalStatus').value = movie.status; 
                    
                    // Xử lý ảnh nền Backdrop
                    detailModalContent.style.backgroundImage = 'none'; // Xóa ảnh nền cũ tránh bị chớp
                    if (movie.backdrop) {
                        detailModalContent.style.backgroundImage = `url('${movie.backdrop}')`;
                    } else {
                        // Nếu phim cũ chưa có ảnh nền, gọi API để lấy và lưu lại tự động
                        try {
                            const res = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${TMDB_API_KEY}&language=vi-VN`);
                            const data = await res.json();
                            if(data.backdrop_path) {
                                movie.backdrop = `https://image.tmdb.org/t/p/w1280${data.backdrop_path}`;
                                localStorage.setItem('myTmdbLibraryBlue', JSON.stringify(myMovies));
                                detailModalContent.style.backgroundImage = `url('${movie.backdrop}')`;
                            }
                        } catch(e) {
                            console.log("Không tải được backdrop cho phim cũ.");
                        }
                    }

                    const trailerBtn = document.getElementById('playTrailerBtn');
                    const trailerContainer = document.getElementById('trailerContainer');
                    trailerContainer.innerHTML = ''; 
                    trailerBtn.style.display = 'inline-flex'; 
                    trailerBtn.textContent = '▶ Xem Trailer';
                    trailerBtn.disabled = false;

                    trailerBtn.onclick = async () => {
                        trailerBtn.textContent = '⏳ Đang tải...';
                        try {
                            const res = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}/videos?api_key=${TMDB_API_KEY}`);
                            const data = await res.json();
                            const trailer = data.results.find(vid => vid.site === 'YouTube' && vid.type === 'Trailer');
                            
                            if (trailer) {
                                trailerBtn.style.display = 'none'; 
                                trailerContainer.innerHTML = `
                                    <iframe width="100%" height="315" 
                                        src="https://www.youtube.com/embed/${trailer.key}?autoplay=1" 
                                        frameborder="0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowfullscreen>
                                    </iframe>
                                `;
                            } else {
                                trailerBtn.textContent = '❌ Không tìm thấy Trailer';
                                trailerBtn.disabled = true;
                            }
                        } catch (err) {
                            trailerBtn.textContent = '❌ Lỗi kết nối';
                            trailerBtn.disabled = true;
                        }
                    };

                    document.getElementById('movieModal').style.display = 'flex';
                });

                movieGrid.appendChild(card);
            });
            applyFilters(); 
        }

        document.getElementById('modalStatus').addEventListener('change', (e) => {
            if(currentOpenMovieIndex !== null) {
                myMovies[currentOpenMovieIndex].status = e.target.value;
                localStorage.setItem('myTmdbLibraryBlue', JSON.stringify(myMovies));
                renderMovies();
            }
        });
        
        function applyFilters() {
            const searchTerm = document.querySelector('.search-bar').value.toLowerCase().trim();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;

            document.querySelectorAll('.movie-card').forEach(card => {
                const title = card.querySelector('.movie-title').textContent.toLowerCase();
                const status = card.dataset.status;

                if (title.includes(searchTerm) && (activeFilter === 'all' || status === activeFilter)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        document.querySelector('.search-bar').addEventListener('input', applyFilters);
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyFilters();
            });
        });

        renderMovies();

        function stopTrailer() { document.getElementById('trailerContainer').innerHTML = ''; }

        const addMovieModal = document.getElementById('addMovieModal');
        document.getElementById('openFormBtn').onclick = () => addMovieModal.style.display = 'flex';
        document.getElementById('closeFormBtn').onclick = () => addMovieModal.style.display = 'none';
        
        document.getElementById('closeDetailBtn').onclick = () => {
            document.getElementById('movieModal').style.display = 'none';
            stopTrailer(); 
        };

        window.onclick = (e) => {
            const movieModal = document.getElementById('movieModal');
            if (e.target === movieModal) {
                movieModal.style.display = 'none';
                stopTrailer(); 
            }
            if (e.target === addMovieModal) {
                addMovieModal.style.display = 'none';
            }
        };

        const tmdbSearchBtn = document.getElementById('tmdbSearchBtn');
        const tmdbSearchInput = document.getElementById('tmdbSearchInput');
        const tmdbResults = document.getElementById('tmdbResults');

        tmdbSearchBtn.onclick = async () => {
            const query = tmdbSearchInput.value.trim();
            if (!query) return;

            tmdbResults.innerHTML = '<p style="color: #94a3b8; text-align: center;">Đang tìm kiếm...</p>';

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=vi-VN&query=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    tmdbResults.innerHTML = '';
                    data.results.forEach(movie => {
                        const posterUrl = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'https://via.placeholder.com/40x60?text=No+Image';
                        const backdropUrl = movie.backdrop_path ? `https://image.tmdb.org/t/p/w1280${movie.backdrop_path}` : '';
                        const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
                        
                        const item = document.createElement('div');
                        item.className = 'tmdb-item';
                        item.innerHTML = `
                            <img src="${posterUrl}" alt="${movie.title}">
                            <div>
                                <h4 style="margin:0; color:white;">${movie.title} (${year})</h4>
                                <p style="margin:5px 0 0; font-size:0.8em; color:#94a3b8; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;">${movie.overview || 'Không có mô tả.'}</p>
                            </div>
                        `;

                        item.onclick = () => {
                            if (myMovies.some(m => m.id === movie.id)) {
                                alert(`Phim "${movie.title}" đã có trong tủ của bạn rồi!`);
                                return;
                            }

                            const newEntry = {
                                id: movie.id,
                                title: movie.title,
                                year: year,
                                rating: movie.vote_average ? movie.vote_average.toFixed(1) : '0.0',
                                img: posterUrl,
                                backdrop: backdropUrl, // Lưu kèm ảnh nền khổ lớn
                                desc: movie.overview || 'Không có mô tả nội dung cho phim này.',
                                status: 'plan_to_watch'
                            };

                            myMovies.unshift(newEntry);
                            localStorage.setItem('myTmdbLibraryBlue', JSON.stringify(myMovies));
                            renderMovies();
                            
                            addMovieModal.style.display = 'none';
                            tmdbSearchInput.value = '';
                            tmdbResults.innerHTML = '<p style="color: #94a3b8; text-align: center; font-size: 0.9em;">Gõ tên phim và bấm Tìm để chọn phim chính thống.</p>';
                        };
                        tmdbResults.appendChild(item);
                    });
                } else {
                    tmdbResults.innerHTML = '<p style="color: #ef4444; text-align: center;">Không tìm thấy bộ phim nào phù hợp!</p>';
                }
            } catch (error) {
                tmdbResults.innerHTML = '<p style="color: #ef4444; text-align: center;">Lỗi kết nối tới máy chủ TMDB!</p>';
            }
        };
    </script>
</body>
</html>
