<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tủ Phim Của Tôi</title>
    <style>
        :root {
            --bg-color: #0b0f19;       
            --text-color: #ffffff;
            --accent-color: #3b82f6;   
            --accent-hover: #2563eb;   
            --card-bg: #1e293b;        
            --border-color: #334155;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0; line-height: 1.6;
        }

        header {
            background-color: rgba(11, 15, 25, 0.9); padding: 20px 50px;
            text-align: center; border-bottom: 2px solid var(--accent-color);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }

        header h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 1px; }
        header p { margin: 5px 0 0; color: #94a3b8; font-size: 1.1em; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .controls {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; background-color: var(--card-bg);
            padding: 15px 20px; border-radius: 8px; flex-wrap: wrap; gap: 15px;
            border: 1px solid var(--border-color);
        }
        
        .search-bar {
            padding: 10px 15px; border: 1px solid var(--border-color); border-radius: 6px;
            background-color: #0f172a; color: white; width: 250px; font-size: 1em;
        }
        .search-bar:focus { outline: 1px solid var(--accent-color); }
        
        .add-btn {
            background-color: var(--accent-color); color: white;
            border: none; padding: 10px 20px; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .add-btn:hover { background-color: var(--accent-hover); transform: scale(1.05); }

        .movie-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px;
        }

        .movie-card {
            background-color: var(--card-bg); border-radius: 10px; overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
            position: relative; border: 1px solid var(--border-color);
        }
        .movie-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--accent-color); }

        .movie-poster { width: 100%; height: 300px; object-fit: cover; display: block; }
        .movie-info { padding: 15px; }
        .movie-title { margin: 0 0 10px; font-size: 1.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { display: flex; justify-content: space-between; color: #94a3b8; font-size: 0.9em; margin-bottom: 5px; }
        .movie-rating { color: #f5c518; font-weight: bold; }

        .delete-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(15, 23, 42, 0.8);
            color: #ef4444; border: none; border-radius: 50%; width: 30px; height: 30px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s, background 0.3s;
        }
        .movie-card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #ef4444; color: white; }

        /* Modal chung */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: var(--card-bg); width: 90%; max-width: 900px;
            border-radius: 12px; display: flex; overflow: hidden; position: relative;
            border: 1px solid var(--border-color);
            max-height: 90vh; /* Giới hạn chiều cao */
            overflow-y: auto; /* Cho phép cuộn nếu nội dung dài */
        }
        
        .form-content { flex-direction: column; padding: 30px; max-width: 500px; }
        .form-content h2 { margin-top: 0; color: white; text-align: center; }
        
        .search-tmdb-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-tmdb-box input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 6px; }
        .search-tmdb-box button { padding: 10px 15px; background: var(--accent-color); color: white; border: none; border-radius: 6px; cursor: pointer; }
        .search-tmdb-box button:hover { background: var(--accent-hover); }
        
        #tmdbResults { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .tmdb-item { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 8px; border-radius: 6px; cursor: pointer; transition: 0.2s; border: 1px solid var(--border-color); }
        .tmdb-item:hover { border-color: var(--accent-color); background: #1e293b; }
        .tmdb-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 30px; color: #94a3b8; cursor: pointer; z-index: 10; }
        .close-btn:hover { color: white; }

        .modal-poster { width: 40%; object-fit: cover; }
        .modal-details { padding: 30px; width: 60%; display: flex; flex-direction: column; }
        .modal-details h2 { margin-top: 0; color: var(--accent-color); font-size: 2em; }
        .modal-desc { margin-top: 15px; line-height: 1.8; color: #cbd5e1; font-size: 0.95em; margin-bottom: 20px; }

        /* Nút Xem Trailer */
        .trailer-btn {
            background-color: #e50914; /* Màu đỏ đặc trưng của YouTube/Netflix */
            color: white; border: none; padding: 10px 20px; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: fit-content;
        }
        .trailer-btn:hover { background-color: #b20710; transform: scale(1.05); }
        .trailer-btn:disabled { background-color: #555; cursor: not-allowed; transform: none; }

        .trailer-container { margin-top: 20px; width: 100%; border-radius: 8px; overflow: hidden; }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; }
            .modal-poster { width: 100%; height: 300px; }
            .modal-details { width: 100%; box-sizing: border-box; }
            .search-bar { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Tủ Phim Của Tôi</h1>
        <p>Kho lưu trữ cá nhân phong cách hiện đại</p>
    </header>

    <div class="container">
        <div class="controls">
            <input type="text" class="search-bar" placeholder="Tìm kiếm trong tủ...">
            <button id="openFormBtn" class="add-btn">+ Thêm Phim Từ TMDB</button>
        </div>

        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <!-- Cửa sổ xem chi tiết phim -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeDetailBtn">&times;</span>
            <img id="modalImg" class="modal-poster" src="" alt="Poster">
            <div class="modal-details">
                <h2 id="modalTitle">Tên Phim</h2>
                <div id="modalMeta" class="movie-meta" style="justify-content: flex-start; gap: 20px;"></div>
                <p id="modalDesc" class="modal-desc">Nội dung chi tiết...</p>
                
                <!-- Khu vực chứa nút Trailer và Video -->
                <button id="playTrailerBtn" class="trailer-btn">▶ Xem Trailer</button>
                <div id="trailerContainer" class="trailer-container"></div>
            </div>
        </div>
    </div>

    <!-- Cửa sổ tìm kiếm TMDB -->
    <div id="addMovieModal" class="modal">
        <div class="modal-content form-content">
            <span class="close-btn" id="closeFormBtn">&times;</span>
            <h2>Tìm Phim Từ TMDB</h2>
            <div class="search-tmdb-box">
                <input type="text" id="tmdbSearchInput" placeholder="Nhập tên phim (VD: Avengers)...">
                <button id="tmdbSearchBtn">Tìm</button>
            </div>
            <div id="tmdbResults">
                <p style="color: #94a3b8; text-align: center; font-size: 0.9em;">Gõ tên phim và bấm Tìm để chọn phim chính thống.</p>
            </div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = "474d7f0a0f0765ce60c19a33e23e1fe8"; 

        const defaultMovies = [
            { id: 157335, title: "Interstellar", year: "2014", rating: "8.6", img: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", desc: "Một nhóm nhà thám hiểm vũ trụ đi qua một hố đen..." },
            { id: 155, title: "The Dark Knight", year: "2008", rating: "9.0", img: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg", desc: "Batman đối mặt với thử thách lớn nhất từ Joker." }
        ];

        let myMovies = JSON.parse(localStorage.getItem('myTmdbLibraryBlue'));
        if (!myMovies) {
            myMovies = defaultMovies;
            localStorage.setItem('myTmdbLibraryBlue', JSON.stringify(myMovies));
        }

        const movieGrid = document.getElementById('movieGrid');

        function renderMovies() {
            movieGrid.innerHTML = '';
            myMovies.forEach((movie, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <button class="delete-btn" title="Xóa phim">&times;</button>
                    <img src="${movie.img}" class="movie-poster" alt="${movie.title}">
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta"><span>${movie.year}</span><span class="movie-rating">★ ${movie.rating}</span></div>
                    </div>
                `;
                
                card.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(confirm(`Bạn có muốn xóa phim "${movie.title}" không?`)) {
                        myMovies.splice(index, 1);
                        localStorage.setItem('myTmdbLibraryBlue', JSON.stringify(myMovies));
                        renderMovies();
                    }
                });

                card.addEventListener('click', () => {
                    document.getElementById('modalTitle').textContent = movie.title;
                    document.getElementById('modalImg').src = movie.img;
                    document.getElementById('modalMeta').innerHTML = `<span>${movie.year}</span><span class="movie-rating">★ ${movie.rating}</span>`;
                    document.getElementById('modalDesc').textContent = movie.desc;
                    
                    // Reset trạng thái khu vực Trailer mỗi lần mở phim mới
                    const trailerBtn = document.getElementById('playTrailerBtn');
                    const trailerContainer = document.getElementById('trailerContainer');
                    trailerContainer.innerHTML = ''; // Xóa video cũ
                    trailerBtn.style.display = 'inline-flex'; // Hiện lại nút
                    trailerBtn.textContent = '▶ Xem Trailer';
                    trailerBtn.disabled = false;

                    // Xử lý sự kiện bấm nút Xem Trailer
                    trailerBtn.onclick = async () => {
                        trailerBtn.textContent = '⏳ Đang tải...';
                        try {
                            // Gọi API lấy danh sách video của phim (ưu tiên tiếng Anh vì tiếng Việt hiếm khi có trailer)
                            const res = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}/videos?api_key=${TMDB_API_KEY}`);
                            const data = await res.json();
                            
                            // Tìm video có loại là "Trailer" trên "YouTube"
                            const trailer = data.results.find(vid => vid.site === 'YouTube' && vid.type === 'Trailer');
                            
                            if (trailer) {
                                trailerBtn.style.display = 'none'; // Ẩn nút đi
                                // Chèn Iframe YouTube vào
                                trailerContainer.innerHTML = `
                                    <iframe width="100%" height="315" 
                                        src="https://www.youtube.com/embed/${trailer.key}?autoplay=1" 
                                        frameborder="0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowfullscreen>
                                    </iframe>
                                `;
                            } else {
                                trailerBtn.textContent = '❌ Không tìm thấy Trailer';
                                trailerBtn.disabled = true;
                            }
                        } catch (err) {
                            trailerBtn.textContent = '❌ Lỗi kết nối';
                            trailerBtn.disabled = true;
                        }
                    };

                    document.getElementById('movieModal').style.display = 'flex';
                });

                movieGrid.appendChild(card);
            });
        }
        
        renderMovies();

        // Hàm tắt video khi đóng Modal
        function stopTrailer() {
            document.getElementById('trailerContainer').innerHTML = ''; 
        }

        const addMovieModal = document.getElementById('addMovieModal');
        document.getElementById('openFormBtn').onclick = () => addMovieModal.style.display = 'flex';
        document.getElementById('closeFormBtn').onclick = () => addMovieModal.style.display = 'none';
        
        document.getElementById('closeDetailBtn').onclick = () => {
            document.getElementById('movieModal').style.display = 'none';
            stopTrailer(); // Tắt tiếng/video khi bấm nút X
        };

        // Đóng modal khi bấm ra ngoài vùng tối
        window.onclick = (e) => {
            const movieModal = document.getElementById('movieModal');
            if (e.target === movieModal) {
                movieModal.style.display = 'none';
                stopTrailer(); // Tắt tiếng/video khi click ra ngoài
            }
            if (e.target === addMovieModal) {
                addMovieModal.style.display = 'none';
            }
        };

        const tmdbSearchBtn = document.getElementById('tmdbSearchBtn');
        const tmdbSearchInput = document.getElementById('tmdbSearchInput');
        const tmdbResults = document.getElementById('tmdbResults');

        tmdbSearchBtn.onclick = async () => {
            const query = tmdbSearchInput.value.trim();
            if (!query) return;

            tmdbResults.innerHTML = '<p style="color: #94a3b8; text-align: center;">Đang tìm kiếm...</p>';

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=vi-VN&query=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    tmdbResults.innerHTML = '';
                    data.results.forEach(movie => {
                        const posterUrl = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'https://via.placeholder.com/40x60?text=No+Image';
                        const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
                        
                        const item = document.createElement('div');
                        item.className = 'tmdb-item';
                        item.innerHTML = `
                            <img src="${posterUrl}" alt="${movie.title}">
                            <div>
                                <h4 style="margin:0; color:white;">${movie.title} (${year})</h4>
                                <p style="margin:5px 0 0; font-size:0.8em; color:#94a3b8; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;">${movie.overview || 'Không có mô tả.'}</p>
                            </div>
                        `;

                        item.onclick = () => {
                            // Kiểm tra xem phim đã có trong thư viện chưa
                            const isExist = myMovies.some(m => m.id === movie.id);
                            if (isExist) {
                                alert(`Phim "${movie.title}" đã có trong tủ của bạn rồi!`);
                                return;
                            }

                            const newEntry = {
                                id: movie.id,
                                title: movie.title,
                                year: year,
                                rating: movie.vote_average ? movie.vote_average.toFixed(1) : '0.0',
                                img: posterUrl,
                                desc: movie.overview || 'Không có mô tả nội dung cho phim này.'
                            };

                            myMovies.unshift(newEntry);
                            localStorage.setItem('myTmdbLibraryBlue', JSON.stringify(myMovies));
                            renderMovies();
                            
                            addMovieModal.style.display = 'none';
                            tmdbSearchInput.value = '';
                            tmdbResults.innerHTML = '<p style="color: #94a3b8; text-align: center; font-size: 0.9em;">Gõ tên phim và bấm Tìm để chọn phim chính thống.</p>';
                            alert(`Đã thêm phim "${movie.title}" thành công!`);
                        };

                        tmdbResults.appendChild(item);
                    });
                } else {
                    tmdbResults.innerHTML = '<p style="color: #ef4444; text-align: center;">Không tìm thấy bộ phim nào phù hợp!</p>';
                }
            } catch (error) {
                tmdbResults.innerHTML = '<p style="color: #ef4444; text-align: center;">Lỗi kết nối tới máy chủ TMDB!</p>';
            }
        };

        document.querySelector('.search-bar').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.movie-card').forEach(card => {
                const title = card.querySelector('.movie-title').textContent.toLowerCase();
                card.style.display = title.includes(searchTerm) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
